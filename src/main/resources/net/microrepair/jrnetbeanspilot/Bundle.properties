OpenIDE-Module-Name=JR NetBeans Pilot
OpenIDE-Module-Display-Category=Editing
OpenIDE-Module-Short-Description=Ask the Microsoft Copilot Windows app for code and insert it at the cursor.
OpenIDE-Module-Long-Description=\
    Sends your question (and the selected code) to the Microsoft Copilot app for Windows, waits for the answer \
    and inserts the code at the cursor or in place of the selection. Tools > Copilot App, the editor's \
    right-click menu, Ctrl+Alt+Shift+C (insert code) and Ctrl+Alt+Shift+E (show the answer). \
    Developer: Jose Rodriguez Arroyo - https://microrepair.net
